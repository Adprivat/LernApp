<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#091328"/>
      <stop offset="100%" stop-color="#0A1A3A"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="48" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#2E5BFF"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="14" y1="12" x2="34" y2="36">
      <stop offset="0%" stop-color="#97A9FF"/>
      <stop offset="100%" stop-color="#2E5BFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="cornerGlow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2E5BFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2E5BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Corner glow -->
  <rect width="48" height="48" rx="12" fill="url(#cornerGlow)"/>
  <!-- Border -->
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="#97A9FF" stroke-opacity="0.15" fill="none"/>
  <!-- Top accent line -->
  <rect x="8" y="0" width="32" height="1" fill="url(#topLine)" opacity="0.8"/>
  <!-- Book icon (open book) -->
  <g filter="url(#glow)">
    <path d="M24 14v18" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M24 14c-2-2-5.5-3-8.5-3S10 12.5 10 14v16c0 1.5 1.5 2 3 2s4-.5 6-1.5c1.5-1 3.5-1.5 5-1.5" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M24 14c2-2 5.5-3 8.5-3S38 12.5 38 14v16c0 1.5-1.5 2-3 2s-4-.5-6-1.5c-1.5-1-3.5-1.5-5-1.5" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>